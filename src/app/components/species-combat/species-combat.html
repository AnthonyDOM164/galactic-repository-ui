<div class="container mt-4">
  <div class="card shadow">
    <div class="card-header bg-danger text-white">
      <h3>{{ 'COMBAT.TITLE' | translate }}</h3>
    </div>
    <div class="card-body">
      <div class="row text-center align-items-center">
        <div class="col-md-5">
          <select class="form-select" [(ngModel)]="id1">
            <option [ngValue]="undefined" disabled>{{ 'COMBAT.SELECT_OPPONENTS' | translate }}</option>
            <option *ngFor="let species of speciesList" [ngValue]="species.id">{{ species.name }} (Pwr: {{ species.powerLevel }})</option>
          </select>
        </div>

        <div class="col-md-2">
          <h2 class="fw-bold">VS</h2>
        </div>

        <div class="col-md-5">
          <select class="form-select" [(ngModel)]="id2">
            <option [ngValue]="undefined" disabled>{{ 'COMBAT.SELECT_OPPONENTS' | translate }}</option>
            <option *ngFor="let species of speciesList" [ngValue]="species.id">{{ species.name }} (Pwr: {{ species.powerLevel }})</option>
          </select>
        </div>
      </div>

      <div class="d-flex justify-content-center gap-3 mt-4">
        <button class="btn btn-warning btn-lg" (click)="onFight()" [disabled]="loading || !id1 || !id2">
          {{ 'COMBAT.START_BUTTON' | translate }}
        </button>
        <button class="btn btn-outline-secondary btn-lg" (click)="onRandomFight()" [disabled]="loading">
          {{ 'COMBAT.RANDOM_BUTTON' | translate }}
        </button>
      </div>

      <div *ngIf="winner" class="alert alert-success mt-4 text-center animate__animated animate__zoomIn">
        <h4>{{ 'COMBAT.WINNER' | translate }}:</h4>
        <h1 class="display-4 fw-bold">{{ winner.name }}</h1>
        <p>{{ winner.specialAbility }}</p>
      </div>
    </div>
  </div>
</div>
